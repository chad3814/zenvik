name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: sudo apt-get update && sudo apt-get install -y 7zip
      - run: scripts/release-build.sh "$GITHUB_REF_NAME" linux/amd64 windows/amd64
      - name: The Windows CLI zip bundles mkvmerge.exe and its notices
        run: |
          list=$(unzip -Z1 dist/zenvik_*_windows_amd64.zip)
          for f in mkvmerge.exe MKVTOOLNIX-NOTICE.txt MKVTOOLNIX-COPYING.txt; do
            grep -q "/$f\$" <<<"$list" || { echo "missing $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-cli
          path: dist/*.tar.gz
      # The Windows zip goes through windows-sign before publish.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-cli
          path: dist/*.zip

  cli-darwin:
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build, sign and notarize the darwin CLI
        env:
          SIGN_REQUIRED: "1"
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/release-build.sh "$GITHUB_REF_NAME" darwin/arm64 darwin/amd64
      - uses: actions/upload-artifact@v4
        with:
          name: release-cli-darwin
          path: dist/*.tar.gz

  gui-darwin:
    strategy:
      fail-fast: true
      matrix:
        target: [darwin/arm64, darwin/amd64]
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version-file: gui/frontend/.nvmrc
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - name: Build, sign, notarize and staple Zenvik.app
        env:
          SIGN_REQUIRED: "1"
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/release-gui.sh "$GITHUB_REF_NAME" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-gui-darwin-${{ strategy.job-index }}
          path: dist/zenvik-gui_*

  gui-other:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, target: windows/amd64, artifact: windows-unsigned-gui }
          - { os: ubuntu-latest, target: linux/amd64, artifact: release-gui-linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version-file: gui/frontend/.nvmrc
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: scripts/release-gui.sh "$GITHUB_REF_NAME" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/zenvik-gui_*

  # Windows code signing (SignPath Foundation): final releases only, once the
  # repository variable SIGNPATH_ORGANIZATION_ID is set; otherwise the zips
  # pass through unsigned. Signing waits for a person to approve the request
  # in SignPath (up to 4 hours). Only this job reads SIGNPATH_API_TOKEN. See
  # signing/README.md.
  windows-sign:
    needs: [cli, gui-other]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 300
    # SignPath's action reads this run's job details and artifact with the
    # job token.
    permissions:
      actions: read
      contents: read
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: mode
        env:
          ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          mode=$(scripts/windows-sign-mode.sh "$GITHUB_REF_NAME" "$ORG")
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          if [[ $mode == sign ]]; then
            echo "signed=true" >>"$GITHUB_OUTPUT"
          else
            echo "signed=false" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v5
        with:
          pattern: windows-unsigned-*
          path: unsigned
          merge-multiple: true
      - if: steps.mode.outputs.mode == 'pass'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: unsigned/*.zip
          overwrite: true
      - if: steps.mode.outputs.mode == 'sign'
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [[ -z $TOKEN ]]; then
            echo "SIGNPATH_ORGANIZATION_ID is set but the release environment has no SIGNPATH_API_TOKEN" >&2
            exit 1
          fi
      - if: steps.mode.outputs.mode == 'sign'
        id: to-sign
        uses: actions/upload-artifact@v4
        with:
          name: windows-to-sign
          path: unsigned/*.zip
          overwrite: true
      - if: steps.mode.outputs.mode == 'sign'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: zenvik
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.to-sign.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed
      - if: steps.mode.outputs.mode == 'sign'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: signed/*.zip
          overwrite: true

  # Always runs (publish needs it): the Windows binaries must run, and when
  # windows-sign signed them, carry valid SignPath Foundation signatures.
  windows-sign-check:
    needs: windows-sign
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-windows
          path: ${{ runner.temp }}/win
      - name: The Windows binaries run, and are signed when signing ran
        env:
          SIGNED: ${{ needs.windows-sign.outputs.signed }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:RUNNER_TEMP\win"
          Get-ChildItem $root -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath "$root\x" -Force }
          $cli = Get-ChildItem "$root\x" -Recurse -Filter zenvik.exe | Select-Object -First 1
          $gui = Get-ChildItem "$root\x" -Recurse -Filter zenvik-gui.exe | Select-Object -First 1
          $mk = @(Get-ChildItem "$root\x" -Recurse -Filter mkvmerge.exe)
          if (-not $cli -or -not $gui -or $mk.Count -ne 2) { throw "missing files: zenvik.exe=$cli zenvik-gui.exe=$gui mkvmerge.exe count=$($mk.Count)" }
          $out = (& $cli.FullName --version) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $out -notlike 'zenvik v*') { throw "zenvik --version printed: $out" }
          if ($env:SIGNED -eq 'true') {
            foreach ($f in $cli, $gui) {
              $s = Get-AuthenticodeSignature $f.FullName
              if ($s.Status -ne 'Valid') { throw "$($f.Name): signature status $($s.Status)" }
              if ($s.SignerCertificate.Subject -notmatch 'SignPath Foundation') { throw "$($f.Name): signed by $($s.SignerCertificate.Subject)" }
              Write-Host "$($f.Name): signed by $($s.SignerCertificate.Subject)"
            }
          } else {
            Write-Host 'not signed this release (a pre-release, or SignPath is not configured)'
          }
          Write-Host 'windows-sign-check: all checks passed'

  publish:
    needs: [cli, cli-darwin, gui-darwin, gui-other, windows-sign, windows-sign-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum ./*.tar.gz ./*.zip ./*.dmg | sed 's| \./| |' > SHA256SUMS && cat SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag)
          if [[ $GITHUB_REF_NAME == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*.tar.gz dist/*.zip dist/*.dmg dist/SHA256SUMS

  # Homebrew (chad3814/homebrew-tap), final releases only: render the formula
  # and cask from what was just published, prove them with the tap's own
  # check.sh, then push. Only homebrew-push can read the deploy key. A failure
  # leaves the release published and the tap on the previous version; re-run
  # the failed job to retry.
  homebrew-render:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/homebrew-render.sh "$GITHUB_REF_NAME" homebrew
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew
          path: homebrew

  homebrew-check:
    needs: homebrew-render
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: "" }
          - { os: ubuntu-latest, args: "--formula-only" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: git clone --depth 1 https://github.com/chad3814/homebrew-tap.git "$RUNNER_TEMP/tap"
      - uses: actions/download-artifact@v5
        with:
          name: homebrew
          path: ${{ runner.temp }}/rendered
      - run: |
          cp -R "$RUNNER_TEMP/rendered/." "$RUNNER_TEMP/tap/"
          "$RUNNER_TEMP/tap/check.sh" ${{ matrix.args }}

  homebrew-push:
    needs: homebrew-check
    runs-on: ubuntu-latest
    environment: release
    concurrency: { group: homebrew-tap-push, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: homebrew
          path: ${{ runner.temp }}/rendered
      - name: Push the bump to chad3814/homebrew-tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [[ -z $DEPLOY_KEY ]]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY is not set in the release environment" >&2
            exit 1
          fi
          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null' EXIT
          ssh-add - <<<"$DEPLOY_KEY" >/dev/null 2>&1
          unset DEPLOY_KEY
          mkdir -p ~/.ssh
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' >~/.ssh/known_hosts
          git clone git@github.com:chad3814/homebrew-tap.git "$RUNNER_TEMP/tap"
          # Never downgrade: a re-run of an older release's push (or two
          # releases racing) leaves a newer tap alone.
          st=0
          scripts/homebrew-should-bump.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/tap" || st=$?
          if [[ $st -eq 3 ]]; then
            exit 0
          elif [[ $st -ne 0 ]]; then
            exit "$st"
          fi
          cp -R "$RUNNER_TEMP/rendered/." "$RUNNER_TEMP/tap/"
          cd "$RUNNER_TEMP/tap"
          git add Formula Casks
          if git diff --cached --quiet; then
            echo "the tap already has zenvik ${GITHUB_REF_NAME#v}"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "zenvik ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main

  # Scoop (chad3814/scoop-bucket), final releases only: render the manifests
  # from what was just published, prove them with the bucket's own check.ps1
  # on Windows, then push. Only scoop-push can read the deploy key. A failure
  # leaves the release published and the bucket on the previous version;
  # re-run the failed job to retry.
  scoop-render:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: scripts/scoop-render.sh "$GITHUB_REF_NAME" scoop
      - uses: actions/upload-artifact@v4
        with:
          name: scoop
          path: scoop

  scoop-check:
    needs: scoop-render
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Install Scoop
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: git clone --depth 1 https://github.com/chad3814/scoop-bucket.git "$env:RUNNER_TEMP\bucket"
      - uses: actions/download-artifact@v5
        with:
          name: scoop
          path: ${{ runner.temp }}/rendered
      - run: |
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP\rendered\bucket\*" "$env:RUNNER_TEMP\bucket\bucket\"
          & "$env:RUNNER_TEMP\bucket\check.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  scoop-push:
    needs: scoop-check
    runs-on: ubuntu-latest
    environment: release
    concurrency: { group: scoop-bucket-push, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: scoop
          path: ${{ runner.temp }}/rendered
      - name: Push the bump to chad3814/scoop-bucket
        env:
          DEPLOY_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
        run: |
          if [[ -z $DEPLOY_KEY ]]; then
            echo "SCOOP_BUCKET_DEPLOY_KEY is not set in the release environment" >&2
            exit 1
          fi
          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null' EXIT
          ssh-add - <<<"$DEPLOY_KEY" >/dev/null
          unset DEPLOY_KEY
          mkdir -p ~/.ssh
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' >~/.ssh/known_hosts
          git clone git@github.com:chad3814/scoop-bucket.git "$RUNNER_TEMP/bucket"
          # Never downgrade: a re-run of an older release's push (or two
          # releases racing) leaves a newer bucket alone.
          have=$(jq -r '.version // empty' "$RUNNER_TEMP/bucket/bucket/zenvik.json" 2>/dev/null || true)
          st=0
          scripts/newer-version.sh "$GITHUB_REF_NAME" "$have" || st=$?
          if [[ $st -eq 3 ]]; then
            exit 0
          elif [[ $st -ne 0 ]]; then
            exit "$st"
          fi
          cp -R "$RUNNER_TEMP/rendered/bucket/." "$RUNNER_TEMP/bucket/bucket/"
          cd "$RUNNER_TEMP/bucket"
          git add bucket
          if git diff --cached --quiet; then
            echo "the bucket already has zenvik ${GITHUB_REF_NAME#v}"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "zenvik ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main

  # winget (microsoft/winget-pkgs via the fork chad3814/winget-pkgs), final
  # releases only: render, install-test on Windows, then open one PR per
  # package. Only winget-submit reads WINGET_TOKEN.
  winget-render:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: scripts/winget-render.sh "$GITHUB_REF_NAME" winget
      - uses: actions/upload-artifact@v4
        with:
          name: winget
          path: winget

  winget-check:
    needs: winget-render
    runs-on: windows-latest
    # It runs third-party code (the WinGet module, winget) with this token.
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: winget
          path: ${{ runner.temp }}/winget
      - name: Validate, install, check and uninstall both packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/winget-check.ps1 -Manifests "$env:RUNNER_TEMP\winget\manifests\c\chad3814" -Version ("$env:GITHUB_REF_NAME".TrimStart('v'))

  winget-submit:
    needs: winget-check
    runs-on: ubuntu-latest
    environment: release
    concurrency: { group: winget-submit, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: winget
          path: ${{ runner.temp }}/winget
      - name: Open microsoft/winget-pkgs PRs
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: scripts/winget-submit.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/winget"

  # Chocolatey (community feed), final releases only: render, pack and
  # install-test on Windows, then push. Only choco-push reads CHOCO_API_KEY.
  choco-render:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: scripts/choco-render.sh "$GITHUB_REF_NAME" choco
      - uses: actions/upload-artifact@v4
        with:
          name: choco
          path: choco

  choco-check:
    needs: choco-render
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: choco
          path: ${{ runner.temp }}/choco
      - name: Pack, install, check and uninstall both packages
        run: ./scripts/choco-check.ps1 -Source "$env:RUNNER_TEMP\choco" -Version ("$env:GITHUB_REF_NAME".TrimStart('v')) -Nupkg "$env:RUNNER_TEMP\nupkg"
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ${{ runner.temp }}/nupkg/*.nupkg

  choco-push:
    needs: choco-check
    runs-on: windows-latest
    environment: release
    concurrency: { group: choco-push, cancel-in-progress: false }
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: nupkg
          path: ${{ runner.temp }}/nupkg
      - name: Push to the Chocolatey community feed
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: ./scripts/choco-push.ps1 -Nupkg "$env:RUNNER_TEMP\nupkg" -Version ("$env:GITHUB_REF_NAME".TrimStart('v'))
