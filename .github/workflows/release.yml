name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: sudo apt-get update && sudo apt-get install -y 7zip
      - run: scripts/release-build.sh "$GITHUB_REF_NAME" linux/amd64 windows/amd64
      - name: The Windows CLI zip bundles mkvmerge.exe and its notices
        run: |
          list=$(unzip -Z1 dist/zenvik_*_windows_amd64.zip)
          for f in mkvmerge.exe MKVTOOLNIX-NOTICE.txt MKVTOOLNIX-COPYING.txt; do
            grep -q "/$f\$" <<<"$list" || { echo "missing $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: |
            dist/*.tar.gz
            dist/*.zip

  cli-darwin:
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build, sign and notarize the darwin CLI
        env:
          SIGN_REQUIRED: "1"
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/release-build.sh "$GITHUB_REF_NAME" darwin/arm64 darwin/amd64
      - uses: actions/upload-artifact@v4
        with:
          name: cli-darwin
          path: dist/*.tar.gz

  gui-darwin:
    strategy:
      fail-fast: true
      matrix:
        target: [darwin/arm64, darwin/amd64]
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version-file: gui/frontend/.nvmrc
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - name: Build, sign, notarize and staple Zenvik.app
        env:
          SIGN_REQUIRED: "1"
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/release-gui.sh "$GITHUB_REF_NAME" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gui-darwin-${{ strategy.job-index }}
          path: dist/zenvik-gui_*

  gui-other:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, target: windows/amd64 }
          - { os: ubuntu-latest, target: linux/amd64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version-file: gui/frontend/.nvmrc
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: scripts/release-gui.sh "$GITHUB_REF_NAME" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gui-other-${{ strategy.job-index }}
          path: dist/zenvik-gui_*

  publish:
    needs: [cli, cli-darwin, gui-darwin, gui-other]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum ./*.tar.gz ./*.zip ./*.dmg | sed 's| \./| |' > SHA256SUMS && cat SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag)
          if [[ $GITHUB_REF_NAME == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*.tar.gz dist/*.zip dist/*.dmg dist/SHA256SUMS

  # Homebrew (chad3814/homebrew-tap), final releases only: render the formula
  # and cask from what was just published, prove them with the tap's own
  # check.sh, then push. Only homebrew-push can read the deploy key. A failure
  # leaves the release published and the tap on the previous version; re-run
  # the failed job to retry.
  homebrew-render:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/homebrew-render.sh "$GITHUB_REF_NAME" homebrew
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew
          path: homebrew

  homebrew-check:
    needs: homebrew-render
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: "" }
          - { os: ubuntu-latest, args: "--formula-only" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: git clone --depth 1 https://github.com/chad3814/homebrew-tap.git "$RUNNER_TEMP/tap"
      - uses: actions/download-artifact@v5
        with:
          name: homebrew
          path: ${{ runner.temp }}/rendered
      - run: |
          cp -R "$RUNNER_TEMP/rendered/." "$RUNNER_TEMP/tap/"
          "$RUNNER_TEMP/tap/check.sh" ${{ matrix.args }}

  homebrew-push:
    needs: homebrew-check
    runs-on: ubuntu-latest
    environment: release
    concurrency: { group: homebrew-tap-push, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: homebrew
          path: ${{ runner.temp }}/rendered
      - name: Push the bump to chad3814/homebrew-tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [[ -z $DEPLOY_KEY ]]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY is not set in the release environment" >&2
            exit 1
          fi
          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null' EXIT
          ssh-add - <<<"$DEPLOY_KEY" >/dev/null 2>&1
          unset DEPLOY_KEY
          mkdir -p ~/.ssh
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' >~/.ssh/known_hosts
          git clone git@github.com:chad3814/homebrew-tap.git "$RUNNER_TEMP/tap"
          # Never downgrade: a re-run of an older release's push (or two
          # releases racing) leaves a newer tap alone.
          st=0
          scripts/homebrew-should-bump.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/tap" || st=$?
          if [[ $st -eq 3 ]]; then
            exit 0
          elif [[ $st -ne 0 ]]; then
            exit "$st"
          fi
          cp -R "$RUNNER_TEMP/rendered/." "$RUNNER_TEMP/tap/"
          cd "$RUNNER_TEMP/tap"
          git add Formula Casks
          if git diff --cached --quiet; then
            echo "the tap already has zenvik ${GITHUB_REF_NAME#v}"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "zenvik ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main

  # Scoop (chad3814/scoop-bucket), final releases only: render the manifests
  # from what was just published, prove them with the bucket's own check.ps1
  # on Windows, then push. Only scoop-push can read the deploy key. A failure
  # leaves the release published and the bucket on the previous version;
  # re-run the failed job to retry.
  scoop-render:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: scripts/scoop-render.sh "$GITHUB_REF_NAME" scoop
      - uses: actions/upload-artifact@v4
        with:
          name: scoop
          path: scoop

  scoop-check:
    needs: scoop-render
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Install Scoop
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: git clone --depth 1 https://github.com/chad3814/scoop-bucket.git "$env:RUNNER_TEMP\bucket"
      - uses: actions/download-artifact@v5
        with:
          name: scoop
          path: ${{ runner.temp }}/rendered
      - run: |
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP\rendered\bucket\*" "$env:RUNNER_TEMP\bucket\bucket\"
          & "$env:RUNNER_TEMP\bucket\check.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  scoop-push:
    needs: scoop-check
    runs-on: ubuntu-latest
    environment: release
    concurrency: { group: scoop-bucket-push, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: scoop
          path: ${{ runner.temp }}/rendered
      - name: Push the bump to chad3814/scoop-bucket
        env:
          DEPLOY_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
        run: |
          if [[ -z $DEPLOY_KEY ]]; then
            echo "SCOOP_BUCKET_DEPLOY_KEY is not set in the release environment" >&2
            exit 1
          fi
          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null' EXIT
          ssh-add - <<<"$DEPLOY_KEY" >/dev/null
          unset DEPLOY_KEY
          mkdir -p ~/.ssh
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' >~/.ssh/known_hosts
          git clone git@github.com:chad3814/scoop-bucket.git "$RUNNER_TEMP/bucket"
          # Never downgrade: a re-run of an older release's push (or two
          # releases racing) leaves a newer bucket alone.
          have=$(jq -r '.version // empty' "$RUNNER_TEMP/bucket/bucket/zenvik.json" 2>/dev/null || true)
          st=0
          scripts/newer-version.sh "$GITHUB_REF_NAME" "$have" || st=$?
          if [[ $st -eq 3 ]]; then
            exit 0
          elif [[ $st -ne 0 ]]; then
            exit "$st"
          fi
          cp -R "$RUNNER_TEMP/rendered/bucket/." "$RUNNER_TEMP/bucket/bucket/"
          cd "$RUNNER_TEMP/bucket"
          git add bucket
          if git diff --cached --quiet; then
            echo "the bucket already has zenvik ${GITHUB_REF_NAME#v}"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "zenvik ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main

  # winget (microsoft/winget-pkgs via the fork chad3814/winget-pkgs), final
  # releases only: render, install-test on Windows, then open one PR per
  # package. Only winget-submit reads WINGET_TOKEN.
  winget-render:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: scripts/winget-render.sh "$GITHUB_REF_NAME" winget
      - uses: actions/upload-artifact@v4
        with:
          name: winget
          path: winget

  winget-check:
    needs: winget-render
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: winget
          path: ${{ runner.temp }}/winget
      - name: Validate, install, check and uninstall both packages
        run: |
          $ErrorActionPreference = 'Stop'
          function Run { $cmd = $args[0]; $rest = @($args | Select-Object -Skip 1); & $cmd @rest; if ($LASTEXITCODE -ne 0) { throw "$($args -join ' ') exited with $LASTEXITCODE" } }
          # Always bring winget up to date: the runner's can predate the
          # manifests' schema (1.12), and it then warns on every header.
          Install-PackageProvider -Name NuGet -Force | Out-Null
          Install-Module Microsoft.WinGet.Client -Force -Scope AllUsers
          Repair-WinGetPackageManager -Latest -Force
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { throw 'winget is not on PATH after Repair-WinGetPackageManager' }
          Run winget --version
          Run winget settings --enable LocalManifestFiles
          $ver = "$env:GITHUB_REF_NAME".TrimStart('v')
          $root = "$env:RUNNER_TEMP\winget\manifests\c\chad3814"
          # Portable installs go to user or machine scope; look in both.
          $links = @("$env:LOCALAPPDATA\Microsoft\WinGet\Links", "$env:ProgramFiles\WinGet\Links")
          $pkgs = @("$env:LOCALAPPDATA\Microsoft\WinGet\Packages", "$env:ProgramFiles\WinGet\Packages")
          foreach ($p in 'Zenvik', 'ZenvikGUI') {
            $dir = "$root\$p\$ver"
            # winget validate exits non-zero on mere warnings; what counts
            # is that validation succeeded.
            $v = (& winget validate --manifest $dir 2>&1) -join "`n"
            Write-Host $v
            if ($v -notmatch 'Manifest validation succeeded') { throw "winget validate failed for ${p}: $v" }
            Run winget install --manifest $dir --accept-package-agreements --accept-source-agreements --disable-interactivity
          }
          $cli = $links | ForEach-Object { Join-Path $_ 'zenvik.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cli) { throw 'no zenvik.exe link after install' }
          $out = (Run $cli --version) -join "`n"
          if ($out -notlike "zenvik v$ver*") { throw "zenvik --version printed: $out" }
          # Through winget's link, zenvik must find the mkvmerge.exe bundled
          # beside its real executable (doctor names the source).
          $doc = (& $cli doctor 2>&1) -join "`n"
          if ($doc -notmatch 'mkvmerge: .*, bundled\)') { throw "zenvik doctor didn't use the bundled mkvmerge: $doc" }
          foreach ($id in 'chad3814.Zenvik', 'chad3814.ZenvikGUI') {
            $home_ = $pkgs | ForEach-Object { Get-ChildItem $_ -Directory -Filter "${id}_*" -ErrorAction SilentlyContinue } | Select-Object -First 1
            if (-not $home_) { throw "no package folder for $id" }
            $mk = Get-ChildItem $home_.FullName -Recurse -Filter mkvmerge.exe | Select-Object -First 1
            if (-not $mk) { throw "no bundled mkvmerge.exe for $id" }
            $out = (Run $mk.FullName --version) -join "`n"
            if ($out -notlike 'mkvmerge v*') { throw "$id's mkvmerge.exe printed: $out" }
          }
          foreach ($id in 'chad3814.ZenvikGUI', 'chad3814.Zenvik') {
            Run winget uninstall --id $id --disable-interactivity
          }
          Write-Host 'winget-check: all checks passed'

  winget-submit:
    needs: winget-check
    runs-on: ubuntu-latest
    environment: release
    concurrency: { group: winget-submit, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: winget
          path: ${{ runner.temp }}/winget
      - name: Open microsoft/winget-pkgs PRs
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: scripts/winget-submit.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/winget"

  # Chocolatey (community feed), final releases only: render, pack and
  # install-test on Windows, then push. Only choco-push reads CHOCO_API_KEY.
  choco-render:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: scripts/choco-render.sh "$GITHUB_REF_NAME" choco
      - uses: actions/upload-artifact@v4
        with:
          name: choco
          path: choco

  choco-check:
    needs: choco-render
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: choco
          path: ${{ runner.temp }}/choco
      - name: Pack, install, check and uninstall both packages
        run: |
          $ErrorActionPreference = 'Stop'
          function Run { $cmd = $args[0]; $rest = @($args | Select-Object -Skip 1); & $cmd @rest; if ($LASTEXITCODE -ne 0) { throw "$($args -join ' ') exited with $LASTEXITCODE" } }
          $ver = "$env:GITHUB_REF_NAME".TrimStart('v')
          $src = "$env:RUNNER_TEMP\choco"
          $nupkg = "$env:RUNNER_TEMP\nupkg"
          New-Item -ItemType Directory -Force $nupkg | Out-Null
          foreach ($id in 'zenvik', 'zenvik-gui') {
            Run choco pack "$src\$id\$id.nuspec" --outputdirectory $nupkg
            Run choco install $id --source $nupkg -y --no-progress
          }
          $out = (Run zenvik --version) -join "`n"
          if ($out -notlike "zenvik v$ver*") { throw "zenvik --version printed: $out" }
          if (Test-Path "$env:ChocolateyInstall\bin\mkvmerge.exe") { throw 'the bundled mkvmerge.exe got a shim on PATH' }
          # Through Chocolatey's shim, zenvik must find the mkvmerge.exe
          # bundled beside its real executable (doctor names the source).
          $doc = (& zenvik doctor 2>&1) -join "`n"
          if ($doc -notmatch 'mkvmerge: .*, bundled\)') { throw "zenvik doctor didn't use the bundled mkvmerge: $doc" }
          foreach ($id in 'zenvik', 'zenvik-gui') {
            $mk = Get-ChildItem "$env:ChocolateyInstall\lib\$id\tools" -Recurse -Filter mkvmerge.exe | Select-Object -First 1
            if (-not $mk) { throw "no bundled mkvmerge.exe in $id" }
            $out = (Run $mk.FullName --version) -join "`n"
            if ($out -notlike 'mkvmerge v*') { throw "$id's mkvmerge.exe printed: $out" }
          }
          $lnk = Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'Zenvik.lnk'
          if (-not (Test-Path $lnk)) { throw "no Start-menu shortcut at $lnk" }
          foreach ($id in 'zenvik-gui', 'zenvik') { Run choco uninstall $id -y }
          if (Test-Path $lnk) { throw 'uninstall left the Start-menu shortcut' }
          Write-Host 'choco-check: all checks passed'
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ${{ runner.temp }}/nupkg/*.nupkg

  choco-push:
    needs: choco-check
    runs-on: windows-latest
    environment: release
    concurrency: { group: choco-push, cancel-in-progress: false }
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: nupkg
          path: ${{ runner.temp }}/nupkg
      - name: Push to the Chocolatey community feed
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CHOCO_API_KEY) { throw 'CHOCO_API_KEY is not set in the release environment' }
          $ver = [version]"$env:GITHUB_REF_NAME".TrimStart('v')
          foreach ($id in 'zenvik', 'zenvik-gui') {
            $file = "$env:RUNNER_TEMP\nupkg\$id.$ver.nupkg"
            $feed = 'https://community.chocolatey.org/api/v2'
            try {
              Invoke-WebRequest "$feed/Packages(Id='$id',Version='$ver')" -UseBasicParsing | Out-Null
              Write-Host "$id $ver is already on the feed (or in moderation); skipping"
              continue
            } catch { }
            $xml = [xml](Invoke-WebRequest "$feed/FindPackagesById()?id='$id'" -UseBasicParsing).Content
            $have = @($xml.feed.entry | ForEach-Object { $_.properties.Version } | Where-Object { $_ -match '^\d+\.\d+\.\d+$' } | ForEach-Object { [version]$_ } | Sort-Object)
            if ($have.Count -gt 0 -and $have[-1] -ge $ver) {
              Write-Host "${id}: the feed already has $($have[-1]); skipping"
              continue
            }
            $out = choco push $file --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0) {
              if ($out -match 'already exists|409|Conflict') { Write-Host "$id $ver was already submitted; skipping"; continue }
              throw "choco push $id exited with $LASTEXITCODE"
            }
          }
