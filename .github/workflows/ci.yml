name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
        env:
          CGO_ENABLED: "0"

  integration-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: brew install mkvtoolnix ffmpeg dvdauthor
      - run: mkvmerge --version && ffmpeg -version | sed -n 1p
      - run: go test -tags integration ./...

  integration-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y mkvtoolnix ffmpeg dvdauthor
      - run: mkvmerge --version && ffmpeg -version | sed -n 1p
      - run: go test -tags integration ./...

  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version-file: gui/frontend/.nvmrc
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - working-directory: gui/frontend
        run: npm ci && npm run lint && npm test && npm run build
      - working-directory: gui
        # frontend/node_modules can hold Go packages (npm's flatted ships one); skip them.
        run: |
          pkgs=()
          while IFS= read -r p; do pkgs+=("$p"); done < <(go list ./... | grep -v /node_modules/)
          go vet ${{ runner.os == 'Linux' && '-tags webkit2_41' || '' }} "${pkgs[@]}"
          go test ${{ runner.os == 'Linux' && '-tags webkit2_41' || '' }} "${pkgs[@]}"
      - if: runner.os == 'macOS'
        run: brew install mkvtoolnix ffmpeg
      - if: runner.os == 'macOS'
        working-directory: gui
        run: go test -tags integration ./internal/queue/
      - working-directory: gui
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.16.0 build -clean ${{ runner.os == 'Linux' && '-tags webkit2_41' || '' }}

  bundled-mkvmerge:
    # Proves the desktop app's mkvmerge fetch (download, checksum, extraction,
    # notices) on each bundling platform before a release tag depends on it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin/arm64, exe: mkvmerge }
          - { os: windows-latest, target: windows/amd64, exe: mkvmerge.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - run: scripts/fetch-mkvmerge_test.sh
      - run: scripts/fetch-mkvmerge.sh "${{ matrix.target }}" "$RUNNER_TEMP/mtx"
      - run: |
          "$RUNNER_TEMP/mtx/${{ matrix.exe }}" --version
          ls "$RUNNER_TEMP/mtx" "$RUNNER_TEMP/mtx/MKVTOOLNIX-LICENSES"
          cat "$RUNNER_TEMP/mtx/MKVTOOLNIX-NOTICE.txt"
      - run: |
          # shellcheck source=/dev/null
          source third_party/mkvtoolnix.env
          scripts/check-mkvtoolnix-source.sh "$MKVTOOLNIX_VERSION"
